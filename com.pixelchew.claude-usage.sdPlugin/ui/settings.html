<!doctype html>
<html>
	<head lang="en">
		<title>Claude Usage Settings</title>
		<meta charset="utf-8" />
		<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
	</head>
	<body>
		<sdpi-item label="Show">
			<sdpi-select setting="display" default="left">
				<option value="left">% left</option>
				<option value="used">% used</option>
			</sdpi-select>
		</sdpi-item>
		<p style="color: #9a9a9a; font-size: 9pt; margin: 8px 12px">
			Numbers come from Claude Code's status line, so they refresh whenever you use Claude Code. Pressing the key (or dial) also flips left / used.
		</p>
	</body>
</html>
