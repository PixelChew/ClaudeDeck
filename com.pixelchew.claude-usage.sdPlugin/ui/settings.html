<!doctype html>
<html>
	<head lang="en">
		<title>Claude Usage Settings</title>
		<meta charset="utf-8" />
		<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
	</head>
	<body>
		<sdpi-item label="Show">
			<sdpi-select setting="display" default="used">
				<option value="used">% used</option>
				<option value="left">% left</option>
			</sdpi-select>
		</sdpi-item>
		<sdpi-item label="Colour">
			<sdpi-checkbox setting="monotone" label="Monotone"></sdpi-checkbox>
		</sdpi-item>
		<sdpi-item label="Live usage">
			<sdpi-checkbox setting="liveUsage" global label="Also track chat (unofficial)"></sdpi-checkbox>
		</sdpi-item>
		<p style="color: #9a9a9a; font-size: 9pt; margin: 8px 12px">
			Numbers come from Claude Code, so they refresh whenever you use it. Live usage also checks claude.ai every 2 minutes using Claude Code's sign-in, so chat usage shows too; it applies to every action. Pressing the key (or dial) also flips used / left.
		</p>
	</body>
</html>
